name: Deploy Chess Tourneer to GitHub Pages ♟️🏆

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout исходного кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка компилятора Sass
        run: npm install -g sass

      - name: Установка зависимостей сборщика
        run: npm install

      - name: Сборка стилей Sass (npm run build)
        run: npm run build

      - name: Инициализация конфигурации GitHub Pages
        uses: actions/configure-pages@v4

      - name: Архивация готовых артефактов
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Публикация верстки на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  lighthouse-audit:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout исходного кода
        uses: actions/checkout@v4

      - name: Генерация SVG-датчиков Lighthouse
        uses: jakejarvis/lighthouse-badge-action@master
        with:
          url: ${{ needs.build-and-deploy.outputs.page_url }}
          output_path: 'images'

      - name: Коммит обновленных датчиков в репозиторий
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update lighthouse svg gauges [skip ci]'
          file_pattern: 'images/*.svg'
