name: Deploy Chess Tourneer to GitHub Pages ♟️🏆

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout исходного кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей сборщика
        run: npm install

      - name: Сборка стилей Sass (npm run build)
        run: npm run build

      - name: Инициализация конфигурации GitHub Pages
        uses: actions/configure-pages@v4

      - name: Архивация готовых артефактов
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Публикация верстки на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
